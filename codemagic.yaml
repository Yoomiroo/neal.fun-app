workflows:
  ios-release:
    name: iOS Release (Capacitor SPM)

    environment:
      xcode: latest

    artifacts:
      - build/ipa/*.ipa
      - build/App.xcarchive

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Fix Capacitor permissions
        script: |
          chmod -R +x node_modules/.bin

      - name: Sync Capacitor iOS
        script: |
          npm exec cap sync ios

      - name: Show iOS structure (debug)
        script: |
          ls -R ios

      - name: Archive iOS app (SPM)
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
          -scheme App \
          -configuration Release \
          archive \
          -archivePath $CM_BUILD_DIR/build/App.xcarchive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
          -archivePath $CM_BUILD_DIR/build/App.xcarchive \
          -exportOptionsPlist ios/App/ExportOptions.plist \
          -exportPath $CM_BUILD_DIR/build/ipa