workflows:
  ios-release:
    name: iOS Release

    environment:
      xcode: latest

    scripts:
      - name: Check environment
        script: |
          node --version
          npm --version
          pwd
          ls -la

      - name: Install dependencies
        script: |
          npm install

      - name: Capacitor version
        script: |
          npx cap --version

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios