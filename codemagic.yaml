workflows:
  ios-release:
    name: iOS Release

    environment:
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Fix Capacitor permissions
        script: |
          chmod +x node_modules/.bin/cap

      - name: Capacitor version
        script: |
          npx cap --version

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios